<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1688F5"/>
      <stop offset="100%" stop-color="#1468E8"/>
    </linearGradient>
    <linearGradient id="bGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#286AF0"/>
      <stop offset="100%" stop-color="#7042E8"/>
    </linearGradient>
  </defs>

  <!-- White square background -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <!-- Geometric T -->
  <path d="M145 280 H610 V398 H455 V760 H300 V398 H145 Z"
        fill="url(#tGrad)"/>

  <!-- Geometric B -->
  <path d="M505 425 H745
           C865 425 925 475 925 555
           C925 607 897 640 851 658
           C904 676 934 715 934 774
           C934 862 867 900 748 900
           H505 Z
           M645 532 V623 H735
           C778 623 798 609 798 578
           C798 547 778 532 735 532 Z
           M645 705 V793 H747
           C791 793 810 776 810 749
           C810 720 790 705 747 705 Z"
        fill="url(#bGrad)" fill-rule="evenodd"/>

  <!-- Friendly robot -->
  <g transform="translate(760 245) rotate(10)">
    <!-- antenna -->
    <rect x="64" y="-62" width="12" height="58" rx="6" fill="#176FEA"/>
    <circle cx="70" cy="-78" r="25" fill="#176FEA"/>

    <!-- side ears -->
    <rect x="-28" y="72" width="42" height="76" rx="20" fill="#176FEA"/>
    <rect x="196" y="72" width="42" height="76" rx="20" fill="#176FEA"/>

    <!-- robot body -->
    <rect x="0" y="0" width="210" height="175" rx="62" fill="#F4F5F8"/>
    <rect x="25" y="25" width="160" height="125" rx="43" fill="#102450"/>

    <!-- smiling eyes -->
    <path d="M62 88 Q76 70 90 88" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
    <path d="M120 88 Q134 70 148 88" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
  </g>
</svg>
