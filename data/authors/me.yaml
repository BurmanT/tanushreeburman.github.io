bio: |
  I am a Ph.D. candidate in the Computer Science department at Tufts University. 
  I work at the [Multimodal Learning, Interaction, and Perception Lab](https://mulip.cs.tufts.edu/) led by Associate
  Professor [Jivko Sinapov](https://www.eecs.tufts.edu/~jsinapov/). I've also worked as a Research Assistant at the Tufts 
  [Center for Engineering Education and Outreach](https://ceeo.tufts.edu/).

  My research lies at the intersection of artificial intelligence, human-centered design, and educational robotics. My current work focuses on human-in-the-loop reinforcement learning, studying how different forms of human feedback and user preferences across feedback modalities can improve the performance and alignment of reinforcement learning agents.

  During my undergraduate education at Yale University, I worked with Dr. Kim Blenman in the [Blenman Innovation Group](https://blenmaninnovationgroup.org/) and with Professor Julian Jara-Ettinger in the [Computational Social Cognition Lab](https://cscl.yale.edu/index.html). I also spent two summers as an AI/ML engineer intern at the Lockheed Martin AI Center.

